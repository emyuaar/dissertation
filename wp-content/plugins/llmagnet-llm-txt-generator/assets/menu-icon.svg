<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- AI Brain/Network Icon -->
  <circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.8"/>
  <circle cx="6" cy="8" r="2" fill="currentColor" opacity="0.6"/>
  <circle cx="18" cy="8" r="2" fill="currentColor" opacity="0.6"/>
  <circle cx="6" cy="16" r="2" fill="currentColor" opacity="0.6"/>
  <circle cx="18" cy="16" r="2" fill="currentColor" opacity="0.6"/>
  
  <!-- Connection lines -->
  <line x1="8" y1="9" x2="10" y2="11" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <line x1="16" y1="9" x2="14" y2="11" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <line x1="8" y1="15" x2="10" y2="13" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <line x1="16" y1="15" x2="14" y2="13" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Central connections -->
  <line x1="9" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="15" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Document/Text indicator -->
  <rect x="10" y="18" width="4" height="1" fill="currentColor" opacity="0.4" rx="0.5"/>
  <rect x="9" y="20" width="6" height="1" fill="currentColor" opacity="0.4" rx="0.5"/>
</svg>
